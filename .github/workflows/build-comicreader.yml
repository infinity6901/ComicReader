name: Build ComicReader

on:
  workflow_dispatch:
  push:
    branches: [main, custom]

permissions:
  contents: write

concurrency:
  group: build-comicreader
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/comicreader.keystore"
            printf 'storeFile=%s/comicreader.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ runner.temp }}" "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi

      - name: Build
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Rename APKs
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          DEBUG_SRC=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          RELEASE_SRC=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          [ -n "$DEBUG_SRC" ] && [ -f "$DEBUG_SRC" ]
          [ -n "$RELEASE_SRC" ] && [ -f "$RELEASE_SRC" ]
          mv "$DEBUG_SRC" "ComicReader-${VERSION}-debug.apk"
          mv "$RELEASE_SRC" "ComicReader-${VERSION}-foss-release.apk"
          echo "DEBUG_APK=ComicReader-${VERSION}-debug.apk" >> "$GITHUB_ENV"
          echo "RELEASE_APK=ComicReader-${VERSION}-foss-release.apk" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish release
        run: |
          gh release create "v${VERSION}-r${{ github.run_number }}" "$DEBUG_APK" "$RELEASE_APK" \
            --title "ComicReader ${VERSION} (r${{ github.run_number }})" \
            --notes "Automated build from commit ${{ github.sha }}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
